services:
  namenode:
    build: .
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - 9870:9870
    env_file:
      - ./hadoop_conf.env
    environment:
        ENSURE_NAMENODE_DIR: "/tmp/hadoop-root/dfs/name"
    volumes:
      - ./files_to_add:/files_to_add
      - ./map_reducers:/map_reducers

  datanode:
    build: .
    command: ["hdfs", "datanode"]
    env_file:
      - ./hadoop_conf.env
  
  datanode_b:
    build: .
    command: ["hdfs", "datanode"]
    env_file:
      - ./hadoop_conf.env

  datanode_c:
    build: .
    command: ["hdfs", "datanode"]
    env_file:
      - ./hadoop_conf.env

  resourcemanager:
    build: .
    hostname: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - 8088:8088
    env_file:
      - ./hadoop_conf.env

  nodemanager:
    build: .
    command: ["yarn", "nodemanager"]
    env_file:
      - ./hadoop_conf.env
